name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
    publish:
      name: Publish to PyPI and create GitHub Release
      runs-on: ubuntu-latest
      environment:
        name: pypi
        url: https://pypi.org/p/biathlon
      permissions:
        id-token: write
        contents: write

      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
  
        - uses: actions/setup-python@v5
          with:
            python-version: "3.13"
  
        - name: Validate tag format
          run: |
            set -euo pipefail
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid tag format: ${GITHUB_REF_NAME}"
              echo "Expected: vMAJOR.MINOR.PATCH"
              exit 1
            fi
  
        - name: Build and validate distribution
          run: |
            set -euo pipefail
            python -m pip install --upgrade pip
            python -m pip install build twine
            python -m build
            twine check dist/*
  
        - name: Ensure built version matches tag
          run: |
            set -euo pipefail
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            ls dist/biathlon-"${EXPECTED_VERSION}"-*.whl >/dev/null
  
        - name: Publish package distributions to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1
  
        - name: Create GitHub release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: dist/*
            